services:
  loglens:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: loglens:dev
    working_dir: /app
    volumes:
      - .:/app
      # Native Linux storage inside Docker's VM, for the 30 GB Thunderbird log; much
      # faster than the Windows bind mount above. Inspect with: docker volume inspect loglens_scale
      - scale:/scale
    environment:
      - LOGLENS_DRIVER_MEMORY=${LOGLENS_DRIVER_MEMORY:-5g}
      - GIT_PYTHON_REFRESH=quiet  # MLflow looks for git, which the image does not need
    ports:
      - "127.0.0.1:5000:5000"  # MLflow UI when started with: make mlflow-ui

volumes:
  scale:
